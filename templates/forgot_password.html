{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CoreERP</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="page-login">
<main class="auth-wrapper">
    <section class="auth-card">
        <p class="auth-brand">CoreERP</p>
        <h1 class="auth-title">Reset password</h1>
        {% if messages %}
        {% for message in messages %}
        <p class="alert-banner {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} show">{{ message }}</p>
        {% endfor %}
        {% endif %}
        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" name="email" required>
            </div>
            <div class="form-group">
                <label for="resetPassword">New password</label>
                <input type="password" id="resetPassword" name="password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="resetPasswordConfirmation">Confirm password</label>
                <input type="password" id="resetPasswordConfirmation" name="confirm_password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Update password</button>
        </form>
        <p class="auth-footer"><a href="{% url 'home' %}" class="auth-link">Back to sign in</a></p>
    </section>
</main>
</body>
</html>
